name: NDS checks

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@cafb9917b974ed4ef3af483b3417cbe82b776a99
    with:
      timeout-minutes: 30
      setup: true
      node-version: '26.13.0'
      python-version: '3.15.2'
      bun-version: '1.4.4'
      rust-version: '1.99.1'
      rust-components: rustfmt,clippy
      tool-assets: .github/native-tools.json
