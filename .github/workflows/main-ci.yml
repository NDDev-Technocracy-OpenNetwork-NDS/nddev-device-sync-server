name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned quality tools
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@c192c6adcf22088abf456635de614d42e8fa3f8d # nddev-cicd-v0.6.20
        with:
          # cargo-audit 0.22.2, cargo-deny 0.20.2 and cargo-nextest 0.9.149 from checksummed
          # releases instead of compiling them with cargo install in every job.
          capability: rust
      - name: Run the STD-0004 native Rust contract
        id: native
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@c192c6adcf22088abf456635de614d42e8fa3f8d # nddev-cicd-v0.6.20
      - name: Require complete native results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ steps.native.outputs.status }}
        run: test "$STATUS" = success
      - name: Run the RustSec advisory audit
        run: cargo audit --deny warnings

  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: integration
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify PostgreSQL and SMTP identity acceptance
        run: just integration-postgres
      - name: Build and exercise the actual server container
        shell: bash
        run: |
          docker build --build-arg "NDS_SOURCE_COMMIT=$GITHUB_SHA" --tag nds-server-check .
          trap 'docker rm --force nds-server-check >/dev/null 2>&1 || true' EXIT
          docker run --detach --name nds-server-check --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges:true --memory 128m \
            --pids-limit 64 nds-server-check
          for _ in {1..30}; do
            if docker exec nds-server-check curl --fail --silent --max-time 1 \
              http://127.0.0.1:8080/v1/health > "$RUNNER_TEMP/nds-container-health.json"; then
              break
            fi
            sleep 0.2
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          health = json.loads((Path(os.environ['RUNNER_TEMP']) / 'nds-container-health.json').read_text())
          assert health['status'] == 'ok'
          assert health['source_commit'] == os.environ['GITHUB_SHA']
          assert health['database_configured'] is False
          PY
      - name: Package the tested server image
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/nds-server-image"
          install -d -m 0755 "$directory"
          image="nddev-device-sync-server:source-$GITHUB_SHA"
          docker image tag nds-server-check "$image"
          docker image save --output "$directory/image.tar" "$image"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          directory = Path(os.environ["RUNNER_TEMP"]) / "nds-server-image"
          health = json.loads((Path(os.environ["RUNNER_TEMP"]) / "nds-container-health.json").read_text())
          assert health["status"] == "ok"
          assert health["source_commit"] == os.environ["GITHUB_SHA"]
          digest = hashlib.sha256()
          with (directory / "image.tar").open("rb") as archive:
              for chunk in iter(lambda: archive.read(1024 * 1024), b""):
                  digest.update(chunk)
          reference = "nddev-device-sync-server:source-" + os.environ["GITHUB_SHA"]
          image_id = subprocess.check_output(
              ["docker", "image", "inspect", reference, "--format", "{{.Id}}"],
              text=True,
          ).strip()
          receipt = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "platform": "linux/amd64",
              "image_reference": reference,
              "image_id": image_id,
              "archive_sha256": digest.hexdigest(),
              "container_health_verified": True,
          }
          (directory / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Retain the tested server image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nds-server-image-${{ github.sha }}
          path: ${{ runner.temp }}/nds-server-image/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
