# RUSTSEC-2026-0459 is in libsqlite3-sys 0.37, which Cargo.lock lists only as an optional
# dependency of sqlx-sqlite; this workspace enables sqlx's PostgreSQL driver alone, and
# `cargo tree -i libsqlite3-sys --all-features` prints nothing, so it is never compiled.
# Remove the entry when sqlx-sqlite accepts libsqlite3-sys 0.39 or later.
[advisories]
ignore = ["RUSTSEC-2026-0459"]
